<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F6F8">
<meta name="color-scheme" content="light">
<title>Bar Ordering</title>
<script src="config.js"></script>
<style>
  :root{
    /* Neutral light theme. Only --accent comes from config.js (theme.accent);
       everything else is a plain neutral so the template suits any venue. */
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --line: #DDE1E6;
    --text: #16191D;
    --on-accent: #FFFFFF;
    --muted: #667085;
    --accent: #1F4FD8;
    --accent-dark: #1A3FAE;
    --accent-soft: rgba(31,79,216,0.10);
    --alert: #D92D20;
    --alert-soft: rgba(217,45,32,0.10);
    --sale: #B54708;
    --sale-soft: #FFF6E5;
    --sale-line: #F1C27D;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 12px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button{ font-family: inherit; cursor: pointer; }
  input, textarea{ font-family: inherit; }

  .display{ font-family:var(--font); text-transform: uppercase; letter-spacing: 0.02em; }
  .mono{ font-family:var(--font-mono); }

  #app{ max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: 20px 16px 40px; position: relative; }
  #app.staff-wide{ max-width: 920px; }

  .brand{ text-align:center; margin: 4px 0 22px; }
  .brand .brand-logo{ width: 88px; height: 88px; display:block; margin: 0 auto; }
  .brand .mark{ font-family:var(--font); font-weight:800; font-size: 15px; letter-spacing: 0.28em; color: var(--accent); }
  .brand .sub{ font-size: 11px; color: var(--muted); letter-spacing: 0.1em; margin-top: 8px; text-transform: uppercase; }

  .btn-primary{
    display:block; width:100%; padding: 15px 20px; border:none; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-weight:700; font-size: 15px;
    letter-spacing: 0.03em; text-transform: uppercase; font-family:var(--font);
  }
  .btn-primary:disabled{ background: #C4CAD3; color: var(--muted); }
  .btn-secondary{
    display:block; width:100%; padding: 13px 20px; border: 1.5px solid var(--muted); border-radius: 999px;
    background: transparent; color: var(--text); font-weight:600; font-size: 14px;
  }
  /* Same shape as .btn-secondary but readable on the ticket's light
     paper background (dark ink text/border instead of light offwhite). */
  .btn-ticket-secondary{
    display:block; width:100%; padding: 13px 20px; border: 1.5px solid var(--text); border-radius: 999px;
    background: transparent; color: var(--text); font-weight:600; font-size: 14px;
  }

  /* ---------- Menu screen ---------- */
  .table-pill{
    display:inline-flex; align-items:center; gap:8px; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); margin-bottom: 18px;
  }
  .table-pill b{ color: var(--accent); font-family:var(--font-mono); }
  .table-pill .change{ margin-left: 6px; color: var(--text); text-decoration: underline; background:none; border:none; font-size:12px; padding:0; }

  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width:none; cursor:grab; user-select:none; }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 12.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; white-space:nowrap;
  }
  .cat-tab.active{ background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .cat-heading{ font-family:var(--font); font-size: 20px; margin: 18px 0 8px; color: var(--text); letter-spacing:0.02em; }
  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width:none; cursor:grab; user-select:none; }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 12.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; white-space:nowrap;
    touch-action:manipulation;
  }
  .cat-tab.active{ background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .item-row{
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .item-row.unavailable{ opacity: 0.4; }
  .item-info .name{ font-size: 15px; font-weight:600; }
  .item-info .price{ font-size: 13px; color: var(--muted); margin-top:2px; }
  .item-info .tag86{ font-size: 11px; color: var(--alert); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; }

  .qty-control{ display:flex; align-items:center; gap: 10px; }
  .qty-control button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--muted); background:transparent; color: var(--text); font-size:16px;
  }
  .qty-control .n{ min-width: 18px; text-align:center; font-family:var(--font-mono); font-weight:600; }

  .notes-block{ margin-top: 20px; }
  .notes-block label{ font-size: 12.5px; color: var(--muted); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:6px; }
  .notes-block textarea{
    width:100%; min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); padding: 10px 12px; font-size: 14px; resize: vertical;
  }

  .cart-bar{
    position: sticky; bottom: 12px; margin-top: 22px; background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 10px 10px 10px 20px; display:flex; align-items:center; justify-content:space-between;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .cart-bar .info{
    font-size: 13px; font-weight:600; background:none; border:none; padding:0; margin:0;
    color: var(--text); font-family: inherit; cursor:pointer; text-align:left;
  }
  .cart-bar .info:disabled{ background:none; color: var(--muted); cursor:default; }
  .cart-bar .info .count{ color: var(--alert); }
  .cart-bar button{
    border:none; background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 999px;
    font-family:var(--font); font-weight:700; letter-spacing:0.03em; text-transform: uppercase; font-size:13px;
  }
  .cart-bar button:disabled{ background:#98A2B3; }

  /* ---------- Itemized cart drawer ---------- */
  .cart-backdrop{ position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 79; }
  .cart-drawer{
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px;
    background: var(--surface); color: var(--text); border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    z-index: 80; max-height: 72vh; display:flex; flex-direction:column; box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
  }
  .cart-drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; flex-shrink:0; }
  .cart-drawer-title{ font-family:var(--font); font-weight:800; font-size: 20px; }
  .cart-drawer-close{ background:none; border:none; color: var(--text); font-size: 18px; padding: 4px 8px; }
  .cart-drawer-list{ overflow-y:auto; flex: 1 1 auto; }
  .cart-drawer-line{
    display:flex; align-items:center; gap:10px; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .cart-drawer-line:last-child{ border-bottom:none; }
  .cdl-info{ flex: 1 1 auto; min-width:0; }
  .cdl-name{ font-size: 14px; font-weight:600; }
  .cdl-price{ font-size: 12px; color: var(--muted); margin-top:2px; }
  .cdl-remove{
    background:none; border:none; color: var(--alert); font-size:12px; text-decoration:underline;
    padding: 4px 0 4px 4px; flex-shrink:0; white-space:nowrap;
  }
  .cart-drawer .qty-control button{ color: var(--text); border-color: var(--line); }
  .cart-drawer-total{
    display:flex; justify-content:space-between; font-weight:700; font-size:15px; padding-top: 14px; margin-top: 10px;
    border-top: 1.5px dashed var(--line); flex-shrink:0;
  }

  /* ---------- Ticket ---------- */
  .ticket-wrap{ position:relative; margin-top: 18px; }
  .ticket{
    background: var(--surface); color: var(--text); border-radius: 6px; position: relative;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45);
  }
  .ticket-head{ padding: 22px 22px 16px; text-align:center; }
  .ticket-head .tnum{ font-family:var(--font-mono); font-size: 13px; letter-spacing:0.1em; color: var(--muted); }
  .ticket-head .tnum b{ color: var(--text); font-size: 15px; }
  .ticket-head .ttitle{ font-family:var(--font); font-weight:800; font-size: 26px; margin-top: 4px; letter-spacing: 0.02em; }

  .tear{ position:relative; height: 0; border-top: 2px dashed var(--line); margin: 0 18px; }
  .tear::before, .tear::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%; background: var(--bg);
  }
  .tear::before{ left: -29px; }
  .tear::after{ right: -29px; }

  .ticket-body{ padding: 16px 22px 22px; }
  .ticket-line{ display:flex; justify-content:space-between; font-size: 14.5px; padding: 5px 0; }
  .ticket-line .q{ font-family:var(--font-mono); color: var(--muted); margin-right:8px; }
  .ticket-notes{ margin-top: 10px; font-size: 13px; font-style: italic; color: var(--muted); }
  .ticket-meta{ font-size: 12px; color: var(--muted); margin-top: 14px; text-align:center; }

  .status-track{ display:flex; align-items:center; margin-top: 22px; }
  .status-step{ flex:1; text-align:center; position:relative; }
  .status-dot{
    width: 16px; height:16px; border-radius:50%; background: #E4E7EC; border: 2px solid var(--line);
    margin: 0 auto 8px; position:relative; z-index:2;
  }
  .status-dot.filled{ background: var(--accent); border-color: var(--accent); }
  .status-dot.filled.red{ background: var(--alert); border-color: var(--alert); }
  .status-line{ position:absolute; top:7px; left:-50%; right:50%; height:2px; background: var(--line); z-index:1; }
  .status-line.filled{ background: var(--accent); }
  .status-label{ font-size: 11px; text-transform:uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight:600; }
  .status-label.active{ color: var(--text); }

  .stamp-banner{
    margin-top: 18px; padding: 16px; border-radius: 10px; text-align:center;
  }
  .stamp-banner.brass{ background: var(--accent-soft); border: 1.5px solid var(--accent); }
  .stamp-banner.red{ background: var(--alert-soft); border: 1.5px solid var(--alert); }
  .stamp-banner .big{ font-family:var(--font); font-weight:800; font-size: 20px; letter-spacing:0.02em; }
  .stamp-banner.brass .big{ color: var(--accent-dark); }
  .stamp-banner.red .big{ color: var(--alert); }
  .stamp-banner .small{ font-size: 12.5px; color: var(--muted); margin-top:4px; }

  .new-order-link{ display:block; text-align:center; margin-top: 22px; color: var(--muted); font-size: 13px; text-decoration: underline; background:none; border:none; width:100%; }

  .ticket-actions{ display:flex; gap:10px; margin-top:16px; }
  .ticket-actions .btn-ticket-secondary{ margin-top:0; }

  /* ---------- Edit ticket ---------- */
  .edit-line{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:14.5px; }
  .edit-line .name{ flex:1 1 auto; padding-right:8px; }
  .edit-line-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .edit-line-actions button{ touch-action: manipulation; }
  .edit-total{ display:flex; justify-content:space-between; font-weight:700; border-top:1px dashed var(--line); margin-top:8px; padding-top:8px; }
  .edit-ticket-actions{ display:flex; gap:10px; margin-top:16px; }
  .btn-save-edit{
    flex:1; padding:11px; border-radius:8px; border:none; background: var(--accent); color: var(--on-accent);
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .btn-cancel-edit{
    flex:1; padding:11px; border-radius:8px; border:1px solid var(--line); background:none;
    color: var(--text); font-weight:600; font-size:13px; cursor:pointer;
  }

  /* ---------- Messages ---------- */
  .msg-thread{ margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .msg-thread-title{ font-size: 11px; text-transform:uppercase; letter-spacing:0.05em; color: var(--muted); font-weight:700; margin-bottom: 8px; }
  .msg-list{ display:flex; flex-direction:column; gap:6px; margin-bottom: 10px; max-height: 220px; overflow-y:auto; }
  .msg-bubble{ max-width: 80%; padding: 7px 11px; border-radius: 12px; font-size: 13px; line-height:1.35; }
  .msg-bubble .t{ font-size:10px; color: var(--muted); margin-top:2px; }
  .msg-bubble.customer{ align-self:flex-end; background: var(--accent-soft); border:1px solid var(--accent); border-bottom-right-radius:3px; }
  .msg-bubble.staff{ align-self:flex-start; background: var(--surface); color: var(--text); border-bottom-left-radius:3px; }
  .msg-bubble.staff .t{ color: var(--muted); }
  .msg-empty{ font-size:12.5px; color: var(--muted); font-style:italic; margin-bottom:10px; }
  .msg-input-row{ display:flex; gap:8px; }
  .msg-input-row input{
    flex:1 1 auto; padding: 10px 12px; border-radius:8px; border:1px solid var(--line);
    background: var(--bg); color: var(--text); font-size:16px; font-family:inherit;
  }
  .msg-input-row button{
    flex-shrink:0; padding: 0 16px; border-radius:8px; border:none; background: var(--accent);
    color: var(--on-accent); font-weight:700; font-size:13px; cursor:pointer; touch-action: manipulation;
  }
  .msg-thread.staff-msg-thread .msg-list{ max-height: 160px; }

  /* Prevents iOS/Android double-tap-to-zoom on rapidly tapped controls
     (qty steppers, buttons) without disabling normal pinch-zoom. */
  button{ touch-action: manipulation; }

  /* ---------- Staff ---------- */
  .staff-header{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .staff-header .brand{ padding-right: 88px; }
  .staff-tabs{
    display:flex; gap:8px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none;
    -webkit-overflow-scrolling:touch; cursor:grab; user-select:none;
  }
  .staff-tabs::-webkit-scrollbar{ display:none; }
  .staff-tab{
    flex:0 0 auto; white-space:nowrap; touch-action:manipulation;
    padding:8px 16px; border-radius:999px; border:1px solid var(--line); background: var(--surface); color: var(--muted);
    font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;
  }
  .staff-tab.active{ background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .logout-link{ background:none; border:none; color: var(--muted); font-size: 13px; text-decoration: underline; }

  .staff-fab-group{
    position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top));
    display:flex; gap:8px; z-index: 50;
  }
  .staff-fab{
    width: 34px; height: 34px; display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 50%;
    color: var(--muted); opacity: 0.6; padding:0; text-decoration:none; touch-action:manipulation;
  }
  .staff-fab:active{ opacity: 0.95; }
  .staff-fab svg{ width:16px; height:16px; }

  .board-section-title{ font-family:var(--font); font-size: 18px; color: var(--muted); margin: 22px 0 10px; letter-spacing:0.05em; }
  .board-grid{ display:grid; grid-template-columns: 1fr; gap: 12px; }
  @media(min-width: 640px){ .board-grid{ grid-template-columns: 1fr 1fr; } }
  @media(min-width: 900px){ .board-grid{ grid-template-columns: 1fr 1fr 1fr; } }

  .order-card{ background: var(--surface); color: var(--text); border-radius: 10px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
  .order-card .row1{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .order-card .card-delete{
    background:none; border:none; color: #8a7a5f; font-size:11.5px; text-decoration:underline; padding:0; cursor:pointer; touch-action:manipulation;
  }
  .order-card .card-delete:active{ color: var(--alert); }
  .order-card .tnum{ font-family:var(--font-mono); font-size:12px; color: var(--muted); }
  .order-card .table{ font-family:var(--font); font-weight:800; font-size: 20px; }
  .order-card .elapsed{ font-size: 11.5px; color: var(--muted); }
  .ticket-num-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color: var(--muted); margin-bottom:8px; }
  .table-change-select{
    background: var(--surface); color: var(--text); border:1px solid var(--line); border-radius:5px;
    font-size:11px; padding:3px 5px; max-width:130px; touch-action:manipulation;
  }
  .order-card .items{ font-size: 13.5px; margin: 6px 0; }
  .order-card .items div{ padding: 1px 0; }
  .order-card .notes{ font-size: 12.5px; font-style: italic; color: var(--muted); margin: 6px 0 10px; }
  .order-card .status-pill{ display:inline-block; font-size: 11px; font-weight:700; text-transform:uppercase; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
  .order-card .status-pill.brass{ background: var(--accent-soft); color: var(--accent-dark); }
  .order-card .status-pill.red{ background: var(--alert-soft); color: var(--alert); }

  .card-actions{ display:flex; gap: 8px; margin-top: 10px; flex-wrap:wrap; }
  .card-actions button{
    flex:1; min-width: 120px; border: none; border-radius: 999px; padding: 9px 10px; font-size: 12.5px; font-weight:700;
    text-transform: uppercase; letter-spacing:0.02em;
  }
  .btn-collect{ background: var(--accent); color: var(--on-accent); }
  .btn-bring{ background: var(--text); color: var(--surface); }
  .btn-done{ background: transparent; border: 1.5px solid var(--muted) !important; color: var(--text); }

  .empty-state{ text-align:center; color: var(--muted); padding: 30px 10px; font-size: 14px; }

  .menu-admin-cat{ margin-bottom: 22px; }
  .cat-heading-row{ display:flex; align-items:baseline; justify-content:space-between; margin: 18px 0 8px; gap: 10px; }
  .cat-heading-row .cat-heading{ margin:0; }
  .cat-heading-row-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .cat-delete{ background:none; border:none; color: var(--muted); font-size:12px; text-decoration:underline; padding:0; white-space:nowrap; }
  .move-btns{ display:flex; gap:4px; flex-shrink:0; }
  .move-btn{
    background: var(--surface); border:1px solid var(--line); color: var(--text); border-radius:5px;
    width:24px; height:24px; font-size:13px; line-height:1; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .move-btn:disabled{ opacity:0.25; cursor:default; }
  .cat-delete:active{ color: var(--alert); }
  .menu-admin-item{ display:flex; align-items:center; justify-content:space-between; background: var(--surface); border:1px solid var(--line); border-radius:8px; padding: 10px 14px; margin-bottom:8px; gap: 10px; }
  .menu-admin-item .n{ font-size:14px; font-weight:600; }
  .menu-admin-item .p{ font-size:12.5px; color: var(--muted); }
  .item-admin-actions{ display:flex; align-items:center; gap: 12px; flex-shrink:0; }
  .item-delete{ background:none; border:none; color: var(--muted); font-size:12px; text-decoration:underline; padding:0; white-space:nowrap; }
  .item-delete:active{ color: var(--alert); }
  .add-item-row{ background: transparent; border: 1.5px dashed var(--line); }
  .add-item-row input{
    background: var(--bg); border:1px solid var(--line); border-radius:6px; color: var(--text);
    padding: 9px 10px; font-size:16px; min-width: 0;
  }
  .add-item-row .add-item-name{ flex: 1 1 auto; }
  .add-item-row .add-item-price{ width: 76px; flex-shrink:0; }
  .item-edit{ color: var(--accent); background:none; border:none; font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline; }
  .edit-item-row{ display:flex; align-items:center; gap:8px; flex:1 1 auto; }
  .edit-item-row input{
    background: var(--bg); border:1px solid var(--line); border-radius:6px; color: var(--text);
    padding: 9px 10px; font-size:16px; min-width: 0;
  }
  .edit-item-row .edit-item-name{ flex:1 1 auto; }
  .edit-item-row .edit-item-price{ width: 76px; flex-shrink:0; }
  .edit-item-actions{ display:flex; gap:8px; flex-shrink:0; }
  .item-save{ color: var(--accent); background:none; border:1px solid var(--accent); border-radius:6px; font-size:12.5px; cursor:pointer; padding:4px 10px; }
  .item-cancel{ color: var(--muted); background:none; border:none; font-size:12.5px; cursor:pointer; padding:4px 2px; }
  .add-item-btn{

  /* ---------- History ---------- */

  .note-meta{ font-size:11px; color: var(--muted); margin-top:2px; }
  .note-status{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--accent); flex-shrink:0; min-width:40px; }
  .note-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .note-edit, .note-delete{ background:none; border:none; color: var(--muted); font-size:12px; text-decoration:underline; padding:0; white-space:nowrap; cursor:pointer; }
  .note-delete:active{ color: var(--alert); }
  .edit-note-row{ display:flex; align-items:center; gap:8px; flex:1 1 auto; }
  .edit-note-input{
    flex:1 1 auto; background: var(--bg); border:1px solid var(--line); border-radius:6px; color: var(--text);
    padding: 9px 10px; font-size:16px; min-width:0;
  }

  .note-cancel{ color: var(--muted); background:none; border:none; font-size:12.5px; cursor:pointer; padding:4px 2px; white-space:nowrap; }

  .toggle{
    position:relative; width: 42px; height:24px; border-radius: 999px; background:#C4CAD3; border:none; flex-shrink:0;

  .toggle .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background: #fff; transition: transform 150ms var(--ease-out); }
  .toggle.on .knob{ transform: translateX(18px); }

  .staff-gate{ text-align:center; padding-top: 12vh; }
  .staff-gate input{
    width: 100%; text-align:center; letter-spacing: 0.3em; font-size: 22px; padding: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); margin: 18px 0; font-family:var(--font-mono);
  }
  .staff-gate .error{ color: var(--alert); font-size: 13px; margin-bottom: 10px; min-height: 16px; }

  .fab-staff{
    position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top));
    width: 34px; height: 34px; display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 50%;
    color: var(--muted); z-index: 50; opacity: 0.55; padding:0;

    position: fixed; top: 16px; left:50%; transform: translateX(-50%); background: var(--text); color: var(--surface);

  /* ---------- Template overrides: keep it plain ---------- */
  .tear::before, .tear::after{ display:none; }

  .btn-primary, .cart-bar button, .card-actions button, .cat-tab, .staff-tab{ font-family: var(--font); }
  .btn-primary:disabled{ background:#C4CAD3; color:#fff; }

  /* ---------- Motion (plans/001-005) ---------- */
  .btn-primary,.btn-secondary,.btn-ticket-secondary,.cart-bar button,.qty-control button,
  .table-btn,.cat-tab,.staff-tab,.card-actions button,.switcher-pill,.add-item-btn,
  .add-cat-btn,.btn-save-edit,.btn-cancel-edit,.msg-input-row button{
    transition: transform 120ms var(--ease-out);
  }
  .btn-primary:not(:disabled):active,.btn-secondary:active,.btn-ticket-secondary:active,
  .cart-bar button:not(:disabled):active,.qty-control button:active,.table-btn:active,
  .cat-tab:active,.staff-tab:active,.card-actions button:active,.switcher-pill:active,
  .add-item-btn:active,.add-cat-btn:active,.btn-save-edit:active,.btn-cancel-edit:active,
  .msg-input-row button:active{ transform: scale(0.97); }
  .stamp-banner.enter{ animation: stampIn 220ms var(--ease-out) both; }
  @keyframes stampIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }
  @keyframes toastIn{ from{ opacity:0; transform: translate(-50%,-8px);} to{ opacity:1; transform: translate(-50%,0);} }
  .toast{ animation: toastIn 200ms var(--ease-out) both; }

  /* ---------- Mobile-native (mobile-native skill) ---------- */
  html{ -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; color-scheme: light; }
  /* Inputs under 16px make iOS zoom the page on focus. Bump on touch devices only. */
  @media (pointer: coarse){ input, textarea, select{ font-size: 16px !important; } }
  a, label, input, select, textarea, summary, [role="button"]{ touch-action: manipulation; }
  button, [role="button"], .cat-tab, .table-btn, .switcher-pill, .fab-staff{
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* Keep inner scrollers from chaining into the page. Root is left alone on
     purpose: pull-to-refresh is welcome on this document-style page. */
  .cart-drawer-list, .msg-list, .promo-modal, #promoModalOverlay{ overscroll-behavior: contain; }
  .cat-tabs{ overscroll-behavior-x: contain; }
  /* Notch / home indicator / landscape insets */
  #app{ padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .cart-bar{ bottom: calc(12px + env(safe-area-inset-bottom)); }
  .toast{ top: calc(16px + env(safe-area-inset-top)); }
  .fab-staff{ right: max(14px, env(safe-area-inset-right)); }

  /* ---------- Reduced motion: keep fades, drop movement ---------- */
  @media (prefers-reduced-motion: reduce){
    @keyframes stampIn{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes toastIn{ from{ opacity:0; } to{ opacity:1; } }
    .btn-primary:active,.btn-secondary:active,.btn-ticket-secondary:active,.cart-bar button:active,
    .qty-control button:active,.table-btn:active,.cat-tab:active,.staff-tab:active,
    .card-actions button:active,.switcher-pill:active,.add-item-btn:active,.add-cat-btn:active,
    .btn-save-edit:active,.btn-cancel-edit:active,.msg-input-row button:active{ transform: none; }
    .toggle .knob{ transition: none; }

<body>
<div id="app"></div>

<script type="module">

const BAR = window.BAR_CONFIG;
const firebaseConfig = BAR.firebase;
// demo: true in config.js swaps Firebase for a browser-only store (demo-db.js).
const FB = BAR.demo
  ? await import("./demo-db.js")
  : Object.assign({},
      await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js"),
      await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js"),
      await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js"));
const { initializeApp, getDatabase, ref, get, set, update, remove, getAuth, signInAnonymously, onAuthStateChanged } = FB;
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const auth = getAuth(fbApp);

// The database rules require a signed-in user (see the rules block you
// paste into the Firebase console). We don't have real staff/customer
// accounts, so everyone signs in anonymously — this is enough to satisfy
// "auth != null" in the rules and keeps out drive-by bots that scan for
// open Firebase databases and hit the REST API directly without ever
// loading this page. It does NOT distinguish staff from customers; that
// would need real staff logins, a bigger separate step.
function ensureSignedIn(){
  return new Promise((resolve, reject)=>{
    onAuthStateChanged(auth, (user)=>{
      if(user){ resolve(user); return; }
      signInAnonymously(auth).catch(reject);
    }, reject);
  });
}

/* =========================================================================
   BAR ORDERING TEMPLATE — STAFF PAGE (staff.html)
   -------------------------------------------------------------------------
   PIN-protected board for incoming orders, menu/availability, tables,
   promotions, notes and order history. The PIN is seeded from config.js
   (defaultStaffPin) on first run and then lives in Firebase at
   config/staffPin — change it there, no redeploy needed.

   This is a PIN check, not real staff accounts. See README.md.
   ========================================================================= */

  const STAFF_PIN_DEFAULT = BAR.defaultStaffPin;

  const DEFAULT_MENU = BAR.menu;

  const CURRENCY = BAR.currency;
  const POLL_MS = 3000;
  // Wording that differs between venues lives in config.js -> labels.
  const L = BAR.labels;


  // ------------------------------------------------------------- branding
  // Everything venue-specific comes from config.js — see README.md.
  document.title = BAR.name + " — " + "Staff";
  function brandHtml(){
    return BAR.logoUrl
      ? `<img class="brand-logo" src="${BAR.logoUrl}" alt="${BAR.name.replace(/"/g,'&quot;')}" style="width:88px;height:88px;display:block;margin:0 auto;">`
      : `<div class="mark">${BAR.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
  }


  const app = document.getElementById("app");

  const state = {
    screen: "staff-gate",     // staff-gate | staff-board | staff-menu | staff-notes | staff-tables | staff-promos
    menu: null,
    tables: null,              // [{ name, tables:[...] }, ...]
    promotions: [],
    promoModal: null,          // the promotion draft object while the add/edit popup is open, else null
    promoIsNew: false,         // true if promoModal is a brand-new promotion, not an edit of an existing one
    expandedPromoCats: {},     // which categories are expanded in the promo modal's drink picker
    orders: [],
    pinInput: "",
    pinError: "",
    toast: null,
    editingItem: null,        // "ci-ii" of the item currently being edited on the 86 board
    msgDrafts: {},             // orderId -> in-progress reply text — kept in state so
                                // the background poll's re-render doesn't erase what's typed
    notesList: [],             // internal staff to-do/feedback notes
    editingNote: null,         // id of the note currently being edited
    editingTable: null,        // "ci-ii" of the table currently being renamed
    staffActiveCatName: null,  // which 86-board category tab is currently showing
    historyRange: "today",     // "today" | "week" | "custom"
    historyFromDate: "",       // custom range only, yyyy-mm-dd
    historyToDate: "",         // custom range only, yyyy-mm-dd
    historyOrders: [],         // every order (any status) fetched for the selected range
    historyLoading: false,
    historyDrinksOpen: false,  // top-drinks card expanded?
    historyHourOpen: false,    // busiest-hour card expanded?
  };

  let pollTimer = null;

  // ---------------------------------------------------------------- storage
  // Backed by Firebase Realtime Database instead of Claude's window.storage,
  // so this works when hosted on Netlify (or anywhere else) rather than only
  // inside a published Claude artifact.
  async function storageGet(key){
    try{
      const snap = await get(ref(db, key));
      return snap.exists() ? snap.val() : null;
    }catch(e){ console.error("firebase get failed", key, e); return null; }
  }
  async function storageSet(key, value){
    try{ await set(ref(db, key), value); return true; }
    catch(e){ console.error("firebase set failed", key, e); return false; }
  }
  async function storageUpdate(key, value){
    try{ await update(ref(db, key), value); return true; }
    catch(e){ console.error("firebase update failed", key, e); return false; }
  }
  async function storageRemove(key){
    try{ await remove(ref(db, key)); return true; }
    catch(e){ console.error("firebase remove failed", key, e); return false; }
  }

  async function ensureMenu(){
    let menu = await storageGet("menu");
    if(!menu){ menu = DEFAULT_MENU; await storageSet("menu", menu); }
    return menu;
  }
  const DEFAULT_TABLES = BAR.tables;
  async function ensureTables(){
    let tables = await storageGet("tables");
    if(!tables){ tables = DEFAULT_TABLES; await storageSet("tables", tables); }
    return tables;
  }

  // ------------------------------------------------------------ PROMOTIONS
  // See the matching comment in index.html for the full shape — this copy
  // needs the same read/compute helpers (to show live status on cards),
  // plus the write side (create/edit/delete) that index.html doesn't need.
  async function ensurePromotions(){
    let promos = await storageGet("promotions");
    if(!promos){ promos = []; await storageSet("promotions", promos); }
    return promos;
  }
  function isPromoActiveNow(promo, now){
    now = now || new Date();
    if(!promo.active) return false;
    if(promo.dateMode === "dates"){
      const d = now.toISOString().slice(0,10);
      if(d < promo.fromDate || d > promo.toDate) return false;
    }
    if(promo.dayMode === "days"){
      if(!promo.days || !promo.days.includes(now.getDay())) return false;
    }
    if(promo.hourMode === "hours"){
      const hm = String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');
      if(promo.fromHour <= promo.toHour){
        if(hm < promo.fromHour || hm > promo.toHour) return false;
      } else {
        if(hm < promo.fromHour && hm > promo.toHour) return false;
      }
    }
    return true;
  }

    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));

  // source, visible to anyone who opened dev tools. It now lives in

  // so the correct PIN never has to appear in the page's source code.
  // Note: this is still just a PIN check, not real staff accounts — a
  // determined person with database access could still read it.
  async function ensureStaffPin(){
    let pin = await storageGet("config/staffPin");
    if(!pin){ pin = STAFF_PIN_DEFAULT; await storageSet("config/staffPin", pin); }

  // then it's treated as expired and the PIN gate shows again. Reloading

  // clock; simply leaving the board open and untouched does not.
  const STAFF_SESSION_MS = 60 * 60 * 1000; // 1 hour

  // array. This means two staff members tapping buttons on different
  // tickets at the same moment can't clobber each other's write, and the
  // customer's ticket screen can fetch just its own order instead of
  // pulling every order on every poll.
  async function getOrders(){
    const obj = await storageGet("orders");
    if(!obj || typeof obj !== "object") return [];
    return Object.values(obj);
  }
  async function getArchivedOrders(){
    const obj = await storageGet("archive");
    if(!obj || typeof obj !== "object") return [];
    return Object.values(obj);

  async function getOrder(id){

  async function updateOrder(id, fields){

  async function sendOrderMessage(orderId, from, text){
    text = text.trim();
    if(!text) return null;
    let order = await getOrder(orderId);
    if(!order) order = await storageGet("archive/"+orderId);
    if(!order) return null;
    const messages = (order.messages || []).concat([{ from, text, ts: Date.now() }]);
    const ok = await updateOrder(orderId, { messages });
    if(!ok) return null;
    return messages;
  }

  // A ticket that hasn't changed status in an hour is either a customer
  // who never came back, or one that got stuck — either way, staff
  // shouldn't have to keep seeing it on the board forever. Auto-closing it
  // (same as marking it "completed") also lets a customer who abandoned it
  // start a fresh order without a dead ticket in the way. Checked both
  // here (covers all tickets, whenever staff has the board open) and on
  // the customer's own poll in index.html (covers the case where staff.html
  // isn't open at all) — whichever side notices first closes it.
  const STALE_AFTER_MS = 60 * 60 * 1000; // 1 hour
  function lastActivityAt(o){
    return Math.max(o.createdAt||0, o.receivedAt||0, o.ready_collectAt||0, o.bringing_upAt||0);
  }
  async function autoCloseStaleOrders(orders){
    const now = Date.now();
    const stale = orders.filter(o => o.status !== "completed" && (now - lastActivityAt(o)) > STALE_AFTER_MS);
    for(const o of stale){
      const ok = await updateOrder(o.id, { status: "completed", completedAt: now });
      if(ok){ o.status = "completed"; o.completedAt = now; }
    }
  }

  // Completed tickets are swept into archive/{id} a few hours after
  // completion so the live "orders" node doesn't grow forever. Runs once
  // whenever a staff member opens the board — cheap and frequent enough.
  const ARCHIVE_AFTER_MS = 3 * 60 * 60 * 1000; // 3 hours
  async function archiveOldCompletedOrders(){
    const orders = await getOrders();
    const now = Date.now();
    const stale = orders.filter(o => o.status === "completed" && o.completedAt && (now - o.completedAt) > ARCHIVE_AFTER_MS);
    for(const o of stale){
      await storageSet("archive/"+o.id, o);
      await storageRemove("orders/"+o.id);
    }
  }

  // ------------------------------------------------------------------ util
  function timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s < 60) return "just now";
    const m = Math.floor(s/60);
    if(m < 60) return m + " min ago";
    const h = Math.floor(m/60);
    if(h < 24) return h + " hour" + (h===1?"":"s") + " ago";
    const d = Math.floor(h/24);
    return d + " day" + (d===1?"":"s") + " ago";
  }
  function money(n){ return CURRENCY + n.toFixed(2); }

  // ------------------------------------------------------------ attention
  // Lightweight "notice me" layer: a synthesized beep (no audio file
  // needed), a short vibration on phones that support it, and a flashing
  // browser tab title. This works as long as the tab is open somewhere —
  // even backgrounded or on another app — but can't wake a closed tab or
  // a locked phone. That needs real push notifications, which is a
  // separate, bigger piece (server-triggered, outside this file).
  let audioCtx = null;
  function playAlertTone(freq, durationMs){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs/1000);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs/1000 + 0.05);
    }catch(e){ /* audio blocked or unavailable — fail silently */ }
  }
  function playNewOrderAlert(){
    playAlertTone(880, 160);
    setTimeout(()=>playAlertTone(1046, 180), 190);
    if(navigator.vibrate) navigator.vibrate([180,80,180]);
  }
  function playMessageAlert(){
    playAlertTone(990, 120);
    setTimeout(()=>playAlertTone(1320, 140), 130);
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }

  const ORIGINAL_TITLE = document.title;
  let titleFlashTimer = null;
  function flashTabTitle(msg){

  }
  function stopFlashTabTitle(){
    if(titleFlashTimer){ clearInterval(titleFlashTimer); titleFlashTimer = null; }
    document.title = ORIGINAL_TITLE;

  window.addEventListener("focus", stopFlashTabTitle);

  function escapeHtml(s){

  // Lets the 86 Board's category tabs scroll sideways with a plain mouse
  // wheel or a click-and-drag, same as the customer menu's category tabs.
  const catDrag = { active:false, startX:0, startScroll:0, dragged:false, el:null };
  window.addEventListener("mouseup", ()=>{
    catDrag.active = false;
    if(catDrag.el) catDrag.el.style.cursor = "";
  });
  window.addEventListener("mousemove", (e)=>{
    if(!catDrag.active || !catDrag.el) return;
    const dx = e.pageX - catDrag.startX;
    if(Math.abs(dx) > 4) catDrag.dragged = true;
    catDrag.el.scrollLeft = catDrag.startScroll - dx;
  });
  function wireCatTabsScroll(el){
    if(!el) return;
    el.addEventListener("wheel", (e)=>{
      if(e.deltaY === 0) return;
      el.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive:false });
    el.addEventListener("mousedown", (e)=>{
      catDrag.active = true; catDrag.dragged = false; catDrag.el = el;
      catDrag.startX = e.pageX; catDrag.startScroll = el.scrollLeft;
      el.style.cursor = "grabbing";
    });
    el.addEventListener("click", (e)=>{
      if(catDrag.dragged){ e.stopPropagation(); e.preventDefault(); catDrag.dragged = false; }
    }, true);
  }

  // =========================================================== STAFF BOARD
  async function pollStaffOrders(){
    const orders = await getOrders();
    await autoCloseStaleOrders(orders); // mutates any stale order objects in place to status "completed"
    const freshIds = orders.filter(o=>o.status==="received").map(o=>o.id);
    if(state.knownFreshIds){
      const newOnes = freshIds.filter(id=>!state.knownFreshIds.has(id));
      if(newOnes.length){
        playNewOrderAlert();
        flashTabTitle(`🔔 ${newOnes.length} new order${newOnes.length>1?'s':''}`);
      }
    }
    state.knownFreshIds = new Set(freshIds);

    const activeOrders = orders.filter(o=>o.status!=="completed");
    const msgCounts = {};
    activeOrders.forEach(o=>{ msgCounts[o.id] = (o.messages||[]).filter(m=>m.from==="customer").length; });
    if(state.knownMsgCounts){
      let hasNew = false;
      activeOrders.forEach(o=>{
        const prev = state.knownMsgCounts[o.id] || 0;
        if(msgCounts[o.id] > prev) hasNew = true;
      });
      if(hasNew){
        playMessageAlert();
        flashTabTitle("💬 New message from a customer");
      }
    }
    state.knownMsgCounts = msgCounts;

    state.orders = orders;
    render();
  }

  function wireStaffMsgThread(o){
    const list = document.getElementById("msgList-"+o.id);
    if(list) list.scrollTop = list.scrollHeight;
    const input = document.getElementById("staffMsgInput-"+o.id);
    const sendBtn = document.getElementById("staffMsgSend-"+o.id);
    if(input) input.oninput = (e)=>{ state.msgDrafts[o.id] = e.target.value; };
    async function send(){
      const text = input.value.trim();
      if(!text) return;
      sendBtn.disabled = true;
      const messages = await sendOrderMessage(o.id, "staff", text);
      sendBtn.disabled = false;
      if(!messages){ showToast("Couldn't send — try again."); return; }
      const idx = state.orders.findIndex(x=>x.id===o.id);
      if(idx>-1) state.orders[idx] = { ...state.orders[idx], messages };
      const counts = state.knownMsgCounts || {};
      counts[o.id] = messages.filter(m=>m.from==="customer").length;
      state.knownMsgCounts = counts;
      delete state.msgDrafts[o.id];
      render();
    }
    if(sendBtn) sendBtn.onclick = send;
    if(input) input.onkeydown = (e)=>{ if(e.key==="Enter") send(); };

  // ========================================================= PROMOTIONS
  const DAY_NAMES_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function formatPromoSchedule(promo){
    const dateText = promo.dateMode === "dates"
      ? `${formatDateShort(promo.fromDate)} \u2013 ${formatDateShort(promo.toDate)}`
      : "Every day";
    const dayText = (promo.dayMode === "days" && promo.days && promo.days.length)
      ? promo.days.slice().sort().map(d=>DAY_NAMES_SHORT[d]).join("/")
      : null;
    const hourText = promo.hourMode === "hours"
      ? `${formatHour12(promo.fromHour)}\u2013${formatHour12(promo.toHour)}`
      : "All day";
    return [dateText, dayText, hourText].filter(Boolean).join(" \u00b7 ");
  }
  function formatDateShort(iso){
    if(!iso) return "?";
    const [y,m,d] = iso.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
  }
  function formatHour12(hm){
    if(!hm) return "?";
    let [h,m] = hm.split(":").map(Number);
    const ampm = h >= 12 ? "pm" : "am";
    h = h % 12; if(h===0) h = 12;
    return `${h}:${String(m).padStart(2,'0')}${ampm}`;
  }

        if(!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
        state.promotions = state.promotions.filter(x=>x.id!==p.id);
        savePromotions().then(()=>render());
      };

  function wirePromoModal(){

    d.includedItemIds = d.includedItemIds || [];

    d.days = d.days || [];

    document.getElementById("promoModalOverlay").onclick = (e)=>{ if(e.target.id==="promoModalOverlay") closePromoModal(); };

    document.getElementById("promoName").oninput = (e)=>{ d.name = e.target.value; };
    document.getElementById("promoDesc").oninput = (e)=>{ d.description = e.target.value; };

    if(percentEl) percentEl.oninput = (e)=>{
      d.discountPercent = parseFloat(e.target.value) || 0;
      render();
    };
    const bogoBuyEl = document.getElementById("promoBogoBuy");
    const bogoGetEl = document.getElementById("promoBogoGet");
    if(bogoBuyEl) bogoBuyEl.oninput = (e)=>{ d.bogoBuy = parseInt(e.target.value) || 1; render(); };
    if(bogoGetEl) bogoGetEl.oninput = (e)=>{ d.bogoGet = parseInt(e.target.value) || 1; render(); };

    const thresholdPercentEl = document.getElementById("promoThresholdPercent");
    if(thresholdQtyEl) thresholdQtyEl.oninput = (e)=>{ d.thresholdQty = parseInt(e.target.value) || 1; render(); };
    if(thresholdPercentEl) thresholdPercentEl.oninput = (e)=>{ d.thresholdPercent = parseFloat(e.target.value) || 0; render(); };
    document.querySelectorAll("[data-set-discounttype]").forEach(btn=>{
      btn.onclick = ()=>{ d.discountType = btn.dataset.setDiscounttype; render(); };
    });

    document.querySelectorAll("[data-set-datemode]").forEach(btn=>{
      btn.onclick = ()=>{
        d.dateMode = btn.dataset.setDatemode;
        if(d.dateMode==="dates" && !d.fromDate){

          d.fromDate = today; d.toDate = today;
        }
        render();
      };
    });
    document.querySelectorAll("[data-set-daymode]").forEach(btn=>{

    });
    document.querySelectorAll("[data-toggle-day]").forEach(btn=>{
      btn.onclick = ()=>{
        const day = parseInt(btn.dataset.toggleDay);
        const set = new Set(d.days);
        if(set.has(day)) set.delete(day); else set.add(day);
        d.days = Array.from(set);
        render();
      };
    });
    document.querySelectorAll("[data-set-hourmode]").forEach(btn=>{
      btn.onclick = ()=>{ d.hourMode = btn.dataset.setHourmode; render(); };
    });
    const advertiseRow = document.getElementById("promoAdvertiseRow");
    if(advertiseRow) advertiseRow.onclick = ()=>{ d.showWhenNotLive = !d.showWhenNotLive; render(); };
    const fromDateEl = document.getElementById("promoFromDate");
    const toDateEl = document.getElementById("promoToDate");
    if(fromDateEl) fromDateEl.onchange = (e)=>{ d.fromDate = e.target.value; };
    if(toDateEl) toDateEl.onchange = (e)=>{ d.toDate = e.target.value; };
    const fromHourEl = document.getElementById("promoFromHour");
    const toHourEl = document.getElementById("promoToHour");
    if(fromHourEl) fromHourEl.onchange = (e)=>{ d.fromHour = e.target.value; };
    if(toHourEl) toHourEl.onchange = (e)=>{ d.toHour = e.target.value; };

    document.querySelectorAll("[data-toggle-cat-expand]").forEach(row=>{
      row.onclick = (e)=>{
        if(e.target.closest("[data-toggle-cat-all]")) return; // the checkbox handles its own click below
        const name = row.dataset.toggleCatExpand;
        state.expandedPromoCats[name] = !state.expandedPromoCats[name];
        render();
      };
    });
    document.querySelectorAll("[data-toggle-cat-all]").forEach(box=>{
      box.onclick = (e)=>{
        e.stopPropagation();
        const cat = state.menu.find(c=>c.name===box.dataset.toggleCatAll);
        if(!cat) return;
        const sel = categorySelectionState(cat);
        const ids = cat.items.map(it=>it.id);
        if(sel.all){
          d.includedItemIds = d.includedItemIds.filter(id=>!ids.includes(id));
        } else {
          const set = new Set(d.includedItemIds);
          ids.forEach(id=>set.add(id));
          d.includedItemIds = Array.from(set);
        }
        render();
      };
    });
    document.querySelectorAll("[data-toggle-item]").forEach(box=>{
      box.onclick = ()=>{
        const id = box.dataset.toggleItem;
        const set = new Set(d.includedItemIds);
        if(set.has(id)){ set.delete(id); delete d.priceOverrides[id]; }
        else set.add(id);
        d.includedItemIds = Array.from(set);
        render();
      };
    });
    document.querySelectorAll("[data-price-override]").forEach(inp=>{
      inp.onchange = (e)=>{
        const id = inp.dataset.priceOverride;
        const val = parseFloat(e.target.value);
        if(isNaN(val) || val < 0){ delete d.priceOverrides[id]; }
        else d.priceOverrides[id] = val;
        render();
      };
    });

    document.getElementById("promoSaveBtn").onclick = ()=>{
      if(!d.name.trim()){ showToast("Give the promotion a name first."); document.getElementById("promoName").focus(); return; }
      if(d.dateMode==="dates" && (!d.fromDate || !d.toDate)){ showToast("Set both dates, or switch to \"Always on\"."); return; }
      if(d.hourMode==="hours" && (!d.fromHour || !d.toHour)){ showToast("Set both hours, or switch to \"All day\"."); return; }
      if(d.discountType==="bogo" && (!(d.bogoBuy>0) || !(d.bogoGet>0))){ showToast("Set both numbers for the buy-X-get-Y deal."); return; }
      if(d.discountType==="threshold" && (!(d.thresholdQty>0) || !(d.thresholdPercent>0))){ showToast("Set the quantity and the discount percentage."); return; }
      d.name = d.name.trim();
      d.description = d.description.trim();
      const idx = state.promotions.findIndex(p=>p.id===d.id);
      if(idx>-1) state.promotions[idx] = d;
      else state.promotions.push(d);
      savePromotions().then(()=>{
        state.promoModal = null;
        render();
      });
    };
  }

  // ============================================================= HISTORY
  function historyRangeBounds(){
    const now = new Date();
    if(state.historyRange === "today"){
      const from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return { from: from.getTime(), to: now.getTime() };
    }
    if(state.historyRange === "week"){
      const from = new Date(now.getTime() - 7*24*60*60*1000);
      return { from: from.getTime(), to: now.getTime() };
    }
    // custom
    const from = state.historyFromDate ? new Date(state.historyFromDate+"T00:00:00").getTime() : 0;
    const to = state.historyToDate ? new Date(state.historyToDate+"T23:59:59").getTime() : now.getTime();
    return { from, to };
  }
  async function loadHistoryOrders(){
    state.historyLoading = true;
    const [active, archived] = await Promise.all([getOrders(), getArchivedOrders()]);
    active.forEach(o=>o._source = "orders");
    archived.forEach(o=>o._source = "archive");
    const { from, to } = historyRangeBounds();
    state.historyOrders = active.concat(archived)
      .filter(o => o.createdAt >= from && o.createdAt <= to)
      .sort((a,b)=>b.createdAt-a.createdAt);
    state.historyLoading = false;
  }
  function historyOrderTotal(o){
    return (o.items||[]).reduce((sum,l)=>sum+l.qty*l.price, 0);
  }
  function historyStats(orders){
    const completed = orders.filter(o=>o.status==="completed");
    const revenue = completed.reduce((sum,o)=>sum+historyOrderTotal(o), 0);
    const drinkCounts = {};
    const hourCounts = new Array(24).fill(0);
    completed.forEach(o=>{
      (o.items||[]).forEach(l=>{ drinkCounts[l.name] = (drinkCounts[l.name]||0) + l.qty; });
      const h = new Date(o.createdAt).getHours();
      hourCounts[h]++;
    });
    const topDrinks = Object.entries(drinkCounts).sort((a,b)=>b[1]-a[1]).map(([name,qty])=>({name,qty}));
    let busiestHour = null, busiestCount = 0;
    hourCounts.forEach((c,h)=>{ if(c>busiestCount){ busiestCount=c; busiestHour=h; } });
    return { orderCount: completed.length, revenue, topDrinks, hourCounts, busiestHour, busiestCount };
  }
  function formatHourRange12(h){
    const ampm = h>=12 ? "pm" : "am";
    let h12 = h % 12; if(h12===0) h12 = 12;
    const nextH = (h+1)%24;
    const nextAmpm = nextH>=12 ? "pm" : "am";
    let nextH12 = nextH % 12; if(nextH12===0) nextH12 = 12;
    return `${h12}${ampm===nextAmpm?'':ampm}\u2013${nextH12}${nextAmpm}`;
  }

        <button class="add-note-btn" id="addNoteBtn">+ Add note</button>
      </div>
      ${notes.length === 0 ? `<div class="empty-state">No notes yet.</div>` : ""}
      ${notes.map(n=>{
        if(state.editingNote === n.id){
          return `
            <div class="note-row">
              <div class="edit-note-row">
                <input type="text" class="edit-note-input" id="editNote-${n.id}" value="${n.text.replace(/"/g,'&quot;')}" maxlength="300">
              </div>
              <div class="note-actions">
                <button class="note-save" data-save-note="${n.id}">Save</button>
                <button class="note-cancel" data-cancel-note="1">Cancel</button>
              </div>
            </div>
          `;
        }
        return `
          <div class="note-row ${n.done?'done':''}">
            <button class="toggle ${n.done?'on':''}" data-toggle-note="${n.id}"><div class="knob"></div></button>
            <div>
              <div class="note-text">${escapeHtml(n.text)}</div>
              <div class="note-meta">${timeAgo(n.createdAt)}</div>
            </div>
            <div class="note-status">${n.done ? "Done" : ""}</div>
            <div class="note-actions">
              <button class="note-edit" data-edit-note="${n.id}">Edit</button>
              <button class="note-delete" data-del-note="${n.id}">Delete</button>
            </div>
          </div>
        `;
      }).join("")}
    `;
    wireStaffHeader();

    const newNoteInput = document.getElementById("newNoteText");
    const addNoteBtn = document.getElementById("addNoteBtn");
    function addNote(){
      const text = newNoteInput.value.trim();
      if(!text) return;
      state.notesList.unshift({ id: newNoteId(), text, done:false, createdAt: Date.now() });
      saveNotesList().then(()=>render());
    }
    addNoteBtn.onclick = addNote;
    newNoteInput.onkeydown = (e)=>{ if(e.key==="Enter") addNote(); };

    app.querySelectorAll("[data-toggle-note]").forEach(btn=>{
      btn.onclick = ()=>{
        const note = state.notesList.find(n=>n.id===btn.dataset.toggleNote);
        if(!note) return;
        note.done = !note.done;
        saveNotesList().then(()=>render());
      };
    });

    app.querySelectorAll("[data-edit-note]").forEach(btn=>{
      btn.onclick = ()=>{ state.editingNote = btn.dataset.editNote; render(); };
    });
    app.querySelectorAll("[data-cancel-note]").forEach(btn=>{
      btn.onclick = ()=>{ state.editingNote = null; render(); };
    });

    function saveNoteEdit(id){
      const input = document.getElementById("editNote-"+id);
      const text = input.value.trim();
      if(!text){ showToast("Note can't be empty."); input.focus(); return; }
      const note = state.notesList.find(n=>n.id===id);
      if(note) note.text = text;
      state.editingNote = null;
      saveNotesList().then(()=>render());
    }
    app.querySelectorAll("[data-save-note]").forEach(btn=>{
      btn.onclick = ()=> saveNoteEdit(btn.dataset.saveNote);
    });
    app.querySelectorAll(".edit-note-input").forEach(inp=>{
      inp.onkeydown = (e)=>{ if(e.key==="Enter") saveNoteEdit(inp.id.replace("editNote-","")); };
    });

    app.querySelectorAll("[data-del-note]").forEach(btn=>{
      btn.onclick = ()=>{
        if(!confirm("Delete this note?")) return;
        state.notesList = state.notesList.filter(n=>n.id!==btn.dataset.delNote);
        saveNotesList().then(()=>render());
      };
    });
  }

  // ================================================================ MASTER
  // Every screen fully rebuilds its HTML on each render() call — including
  // the ~3s background poll that keeps the board live. Without this,
  // typing into a reply box would lose focus and get wiped every few
  // seconds as the poll refreshes the screen. This remembers which input
  // was focused (and where the cursor was) right before the rebuild, then
  // restores both afterward.
  function render(){
    const active = document.activeElement;
    let savedId = null, savedStart = null, savedEnd = null;
    if(active && active.id && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
      savedId = active.id;
      if(typeof active.selectionStart === "number"){
        savedStart = active.selectionStart;
        savedEnd = active.selectionEnd;
      }
    }

    if(state.toast){
      // toast rendered separately, doesn't replace screen
    }
    switch(state.screen){
      case "staff-gate": renderStaffGate(); break;
      case "staff-board": renderStaffBoard(); break;
      case "staff-menu": renderStaffMenu(); break;
      case "staff-tables": renderStaffTables(); break;
      case "staff-promos": renderStaffPromotions(); break;
      case "staff-history": renderStaffHistory(); break;
      case "staff-notes": renderStaffNotes(); break;
    }
    renderStaffFabs();
    renderToast();

    if(savedId){
      const el = document.getElementById(savedId);
      if(el){
        el.focus();
        if(savedStart !== null && typeof el.setSelectionRange === "function"){
          try{ el.setSelectionRange(savedStart, savedEnd); }catch(e){ /* not a text-selectable input */ }
        }
      }
    }
  }

  function renderToast(){
    const old = document.getElementById("appToast");
    if(old && state.toast && old.textContent === state.toast) return; // don't restart the animation on every poll render
    if(old) old.remove();
    if(!state.toast) return;
    const t = document.createElement("div");
    t.className = "toast"; t.id = "appToast"; t.textContent = state.toast;
    document.body.appendChild(t);
  }

  // ================================================================= BOOT
  // Staff always land on the PIN gate first — there's no customer menu
  // Staff always land on the PIN gate first — there's no customer menu
  // on this page at all, so there's nothing to route around. Exception:
  // if they've already signed in this browser (see enterStaff), skip
  // straight to the board instead of asking again every visit.
  async function boot(){
    app.innerHTML = `<div class="empty-state">Loading…</div>`;
    try{
      await ensureSignedIn();
    }catch(e){
      console.error("Anonymous sign-in failed", e);
      app.innerHTML = `<div class="empty-state">Couldn't connect right now.<br>Please try again in a moment.</div>`;
      return;
    }
    state.menu = await ensureMenu();
    state.tables = await ensureTables();
    state.promotions = await ensurePromotions();

    if(localStorage.getItem(BAR.storagePrefix + "staff_logged_in") === "1"){
      const lastActive = parseInt(localStorage.getItem(BAR.storagePrefix + "staff_last_active") || "0", 10);
      const expired = (Date.now() - lastActive) > STAFF_SESSION_MS;
      if(expired){
        localStorage.removeItem(BAR.storagePrefix + "staff_logged_in");
        localStorage.removeItem(BAR.storagePrefix + "staff_last_active");
      } else {
        localStorage.setItem(BAR.storagePrefix + "staff_last_active", String(Date.now())); // reloading counts as activity
        state.screen = "staff-board";
        render();
        startPolling(pollStaffOrders);
        archiveOldCompletedOrders();
        return;
      }
    }

    state.screen = "staff-gate";
    render();
  }

  boot();
</script>
</body>
</html>
